<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쇼츠 대본 · 음성 생성기</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
         max-width: 760px; margin: 0 auto; padding: 20px; background: #f6f7f9; color: #1a1a1a; }
  h1 { font-size: 20px; }
  .card { background: #fff; border: 1px solid #e3e5e8; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-weight: 600; font-size: 13px; margin: 12px 0 5px; }
  input[type=text], textarea, select { width: 100%; padding: 9px; border: 1px solid #ccd; border-radius: 6px; font-size: 14px; font-family: inherit; }
  button { padding: 10px 14px; border: 1px solid #ccd; background: #fff; border-radius: 6px; font-size: 14px; cursor: pointer; }
  button:hover { background: #f0f2f5; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; width: 100%; font-weight: 600; margin-top: 16px; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row button { flex: 1; }
  .muted { font-size: 12px; color: #666; margin-top: 6px; line-height: 1.6; }
  #preview { max-width: 180px; border-radius: 6px; margin-top: 8px; display: block; }
  pre#log { background: #1e1e1e; color: #b8e986; padding: 12px; border-radius: 8px;
            font-size: 12px; max-height: 200px; overflow: auto; white-space: pre-wrap; line-height: 1.6; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .ok { background: #e3f3e5; color: #1a7f37; }
  .warn { background: #fff4e0; color: #9a6400; }
  .scene { border-top: 1px solid #eee; padding: 9px 0; font-size: 14px; }
  .scene b { color: #1a73e8; }
  audio { width: 100%; margin-top: 10px; }
  summary { cursor: pointer; font-size: 13px; color: #555; margin-top: 12px; }
</style>
<script src="https://js.puter.com/v2/"></script>
</head>
<body>

<h1>쇼츠 대본 · 음성 생성기</h1>

<div class="card">
  <label>제품 페이지 링크</label>
  <input type="text" id="url" placeholder="https://... 상품 상세 페이지 주소를 붙여넣으세요">

  <div class="row">
    <button id="byUrl">① 링크 분석</button>
    <button id="bySearch">① 링크 + 검색 (느림)</button>
  </div>
  <div class="muted" id="urlinfo"></div>
  <img id="preview" alt="">

  <details id="manual">
    <summary>자동 입력된 제품명 · 모델명 보기 / 직접 수정</summary>
    <label>제품명</label>
    <input type="text" id="pname" placeholder="링크 분석 후 자동 입력">
    <label>모델명</label>
    <input type="text" id="model" placeholder="링크 분석 후 자동 입력">
    <label>제품 이미지 (링크에서 못 가져왔을 때만)</label>
    <input type="file" id="img" accept="image/*">
    <div class="muted" id="imginfo"></div>
  </details>

  <label>특장점 (한 줄에 하나)</label>
  <textarea id="feat" rows="7" placeholder="분석 후 자동 입력 · 직접 수정 가능"></textarea>
  <div class="muted" id="sources"></div>

  <label>내레이션 음성</label>
  <select id="voice">
    <option value="auto">자동 (대본의 화자 성별에 맞춤)</option>
    <option value="polly:Seoyeon">여성 · 서연 (가장 안정적)</option>
    <option value="openai:coral">여성 · Coral (밝은 광고 톤)</option>
    <option value="openai:nova">여성 · Nova (부드러움)</option>
    <option value="openai:sage">여성 · Sage (차분함)</option>
    <option value="openai:ash">남성 · Ash (활기찬)</option>
    <option value="openai:onyx">남성 · Onyx (중저음)</option>
    <option value="xai:ara">여성 · Ara (xAI, 따뜻함)</option>
    <option value="xai:eve">여성 · Eve (xAI, 에너지)</option>
  </select>

  <button class="primary" id="go">② 대본 · 음성 만들기</button>
</div>

<pre id="log">준비됨. 제품 페이지 링크를 넣고 버튼을 누르세요.</pre>
<div id="out"></div>

<script>
const WORKER = 'https://gemini-proxy.webnjw01.workers.dev';
const TEXT_MODELS = ['gemini-3.5-flash-lite', 'gemini-3.8-flash', 'gemini-2.5-flash-lite', 'gemini-2.5-flash'];

const SCENES = 6;
const PER_SCENE = 24;
const TOTAL = SCENES * PER_SCENE;
const T_MIN = TOTAL - 15;
const T_MAX = TOTAL + 15;

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const noSpace = (s) => String(s).replace(/\s/g, '').length;

const dead = new Set();
let sticky = null;
let IMG = null;
let LAST = null;

function log(msg) {
  const t = new Date().toLocaleTimeString('ko-KR', { hour12: false });
  $('log').textContent += `\n[${t}] ${msg}`;
  $('log').scrollTop = $('log').scrollHeight;
}
function resetLog(m) { $('log').textContent = m; }
function lock(on) { ['byUrl', 'bySearch', 'go'].forEach((id) => { $(id).disabled = on; }); }

/* ---------- 이미지 축소 ---------- */
$('img').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const r = await compress(file);
    IMG = r.b64;
    $('preview').src = 'data:image/jpeg;base64,' + r.b64;
    $('imginfo').textContent = `${r.ow}×${r.oh} → ${r.w}×${r.h} / 약 ${Math.round(r.bytes / 1024)}KB`;
  } catch (err) {
    $('imginfo').textContent = '이미지를 읽을 수 없습니다: ' + err.message;
  }
};

function compress(file, MAX = 768, Q = 0.85) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const ow = im.naturalWidth, oh = im.naturalHeight;
      const s = Math.min(1, MAX / Math.max(ow, oh));
      const w = Math.round(ow * s), h = Math.round(oh * s);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(im, 0, 0, w, h);
      const b64 = c.toDataURL('image/jpeg', Q).split(',')[1];
      URL.revokeObjectURL(url);
      resolve({ b64, w, h, ow, oh, bytes: Math.round(b64.length * 0.75) });
    };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('형식 오류')); };
    im.src = url;
  });
}

/* ---------- Gemini 호출 ---------- */
async function callGemini(payload, timeout = 45000) {
  const order = sticky ? [sticky].concat(TEXT_MODELS.filter((m) => m !== sticky)) : TEXT_MODELS.slice();
  const live = order.filter((m) => !dead.has(m));
  if (!live.length) throw new Error('오늘 쓸 수 있는 모델의 무료 한도를 모두 썼습니다. 한국 시간 오후 4시경 초기화됩니다.');

  let lastErr = new Error('알 수 없는 오류');
  for (const model of live) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    try {
      log(`${model} 요청 중…`);
      const res = await fetch(WORKER, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model, payload }),
        signal: ctrl.signal,
      });
      const data = await res.json();
      clearTimeout(timer);
      if (data && data.error) throw new Error(`${res.status} ${data.error.message || ''}`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      if (!data.candidates || !data.candidates.length) throw new Error('응답이 비어 있습니다');
      sticky = model;
      return data;
    } catch (e) {
      clearTimeout(timer);
      const msg = e.name === 'AbortError' ? `시간 초과 ${timeout / 1000}초` : (e.message || String(e));
      lastErr = new Error(msg);

      if (/no longer available|not found|^404/i.test(msg)) {
        dead.add(model);
        if (sticky === model) sticky = null;
        log(`${model} 은 더 이상 제공되지 않음 → 목록에서 제외`);
        continue;
      }
      if (/retry in \d+h|generate_content_free_tier_requests/i.test(msg)) {
        dead.add(model);
        if (sticky === model) sticky = null;
        log(`${model} 일일 무료 한도 소진 → 오늘은 제외`);
        continue;
      }
      if (/high demand|overload|unavailable|시간 초과|50[0-3]|429/i.test(msg)) {
        log(`${model} 혼잡 → 다음 모델로 전환`);
        await sleep(1500);
        continue;
      }
      log('오류: ' + msg);
      throw lastErr;
    }
  }
  throw lastErr;
}

function textOf(data) {
  const parts = (data.candidates[0].content && data.candidates[0].content.parts) || [];
  return parts.map((p) => p.text || '').join('').trim();
}

/* ---------- ① 링크 분석 ---------- */
const RESEARCH_SCHEMA = {
  type: 'OBJECT',
  properties: {
    name: { type: 'STRING' },
    model: { type: 'STRING' },
    confirmed: { type: 'ARRAY', items: { type: 'STRING' } },
    guessed: { type: 'ARRAY', items: { type: 'STRING' } },
  },
  required: ['name', 'model', 'confirmed', 'guessed'],
};

async function fetchPage(url) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  try {
    const res = await fetch(WORKER + '/page', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
      signal: ctrl.signal,
    });
    const d = await res.json();
    clearTimeout(timer);
    if (d.error) throw new Error(d.error.message);
    return d;
  } catch (e) {
    clearTimeout(timer);
    throw new Error(e.name === 'AbortError' ? '페이지 읽기 시간 초과' : e.message);
  }
}

async function grabImage(imgUrl, referer) {
  const res = await fetch(WORKER + '/img', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url: imgUrl, referer }),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const c = await compress(await res.blob());
  IMG = c.b64;
  $('preview').src = 'data:image/jpeg;base64,' + c.b64;
  $('imginfo').textContent = `링크에서 가져온 이미지 ${c.w}×${c.h}`;
}

$('byUrl').onclick = () => analyze(false);
$('bySearch').onclick = () => analyze(true);

async function analyze(useSearch) {
  const typed = $('url').value.trim();
  if (!/^https?:\/\//i.test(typed)) { resetLog('http로 시작하는 제품 페이지 주소를 넣으세요.'); return; }

  let url = typed;
  const ali = typed.match(/aliexpress[^\/]*\/item\/(\d{10,})/i);
  if (ali) url = 'https://www.aliexpress.com/item/' + ali[1] + '.html';


  lock(true);
  resetLog('페이지를 읽는 중…');
  if (url !== typed) log('링크를 정리했습니다 → ' + url);
  $('sources').textContent = '';


  try {
    let page;
    try {
      page = await fetchPage(url);
    } catch (e) {
      log('페이지를 읽지 못했습니다 (' + e.message.slice(0, 60) + ') → 검색으로 진행합니다.');
      page = { title: '', ogTitle: '', ogImage: '', desc: '', jsonld: [], text: '', mined: '', finalUrl: url, trail: [] };
      useSearch = true;
    }
    $('urlinfo').textContent = page.ogTitle || page.title || '';

    if (page.trail && page.trail.length > 1) log(`링크 추적 ${page.trail.length}단계 → ${String(page.finalUrl).slice(0, 70)}`);
    log(`페이지 수신 — 본문 ${page.text.length}자 / 상품 데이터 ${(page.mined || '').length}자`);

    if (/x5secdata|_____tmd_____|rgv587|punish\?|captcha|슬라이드를 밀어|verify to continue/i.test(page.text + page.mined)) {
      log('쇼핑몰이 로봇 확인 화면을 띄웠습니다. 내용을 버리고 다시 읽어 봅니다…');
      page.text = '';
      page.mined = '';
    }

    if (page.text.length + (page.mined || '').length < 800) {

      log('본문이 비어 있어 다른 방법으로 한 번 더 읽어 봅니다…');
      try {
        const jr = await fetch('https://r.jina.ai/' + (page.finalUrl || url), {
          headers: { 'x-respond-with': 'text' },
        });
        if (jr.ok) {
          const md = (await jr.text()).slice(0, 12000);
          if (md.length > page.text.length) {
            page.text = md;
            log(`다시 읽기 성공 — 본문 ${md.length}자`);
          }
        }
      } catch (e) { log('다시 읽기 실패'); }
    }

    if (page.text.length + (page.mined || '').length < 800 && !useSearch) {
      useSearch = true;
      log('페이지 내용이 부족해 검색으로 자동 보완합니다. 20초쯤 걸립니다.');
    }


    if (page.ogImage) {
      try { await grabImage(page.ogImage, url); log('대표 이미지를 가져왔습니다.'); }
      catch (e) { log('대표 이미지를 못 가져왔습니다.'); }
    }

    const src = [
      '페이지 주소: ' + (page.finalUrl || url),
      '페이지 제목: ' + (page.ogTitle || page.title),
      page.desc ? '요약: ' + page.desc : '',
      page.jsonld && page.jsonld.length ? '구조화 정보: ' + page.jsonld.join(' ').slice(0, 2000) : '',
      page.mined ? '페이지에 심어진 상품 데이터:\n' + page.mined : '',
      '본문: ' + page.text,
    ].filter(Boolean).join('\n');

    let searched = '';
    const hint = $('pname').value.trim();
    if (hint && !page.ogTitle) { page.ogTitle = hint; log('직접 적으신 제품명으로 검색합니다 — ' + hint); }
    const canSearch = useSearch && !!(page.ogTitle || page.title);

    if (useSearch && !canSearch) {
      log('제품명을 모르는 상태라 검색을 건너뜁니다. (주소만으로 검색하면 택배 조회 사이트가 나옵니다)');
    }
    if (canSearch) {
      log('검색으로 제품 정보를 모으는 중…');

      try {
        const s = await callGemini({
          contents: [{ parts: [{ text:
            `다음 제품을 검색해서 한국어로 정리하세요.\n` +
            `제품명: ${page.ogTitle || page.title}\n\n` +
            `브랜드, 정식 제품명, 모델명이나 품번, 주요 사양, 용도, 장점을 항목별로 간단히 적으세요.\n` +
            `주의: 택배 조회, 배송 추적, 통관, 가격 비교 사이트의 내용은 전부 무시하세요. ` +
            `제품 자체를 설명하는 자료만 쓰고, 찾지 못하면 "자료 없음"이라고만 답하세요.`

          }] }],
          tools: [{ google_search: {} }],
          generationConfig: { temperature: 0.3 },
        }, 70000);
        searched = textOf(s);
        const ch = ((s.candidates[0].groundingMetadata || {}).groundingChunks) || [];
        if (ch.length) {
          $('sources').textContent = '출처: ' +
            ch.slice(0, 6).map((c) => (c.web && (c.web.title || c.web.uri)) || '').filter(Boolean).join(' · ');
        }
        log(`검색 결과 ${searched.length}자 확보`);
      } catch (e) {
        log('검색 보완 실패: ' + e.message.slice(0, 80));
      }
    }

    const prompt = `아래 자료에서 제품 하나의 정보를 추려 주세요. 배송·교환 안내, 다른 상품 추천, 메뉴 글자, 회사 소개, 알 수 없는 영문 코드는 모두 무시합니다.

- name: 브랜드를 포함한 정식 제품명. 자료가 부실하면 제목에서 제품 종류를 뽑아 간결하게 지으세요. 빈 값 금지.
- model: 모델명이나 품번. 없으면 name을 짧게 줄여 쓰세요. 빈 값 금지.
- confirmed: 자료에 분명히 적힌 사실만. 한 줄 30자 이내, 최대 6개. 없으면 빈 배열.
- guessed: 자료에 없지만 이 제품 종류라면 당연히 기대되는 특징과 사용 상황. 한 줄 30자 이내.
  ★ confirmed가 비었거나 3개 미만이면 guessed를 반드시 5개 이상 채우세요.

금지 1: 자료에 없는 숫자 성능값, 용량, 인증, 수상, 후기, 가격, 순위. 추측이라도 숫자는 쓰지 마세요.
금지 2: 쇼핑몰 공통 안내는 특장점이 아닙니다. 무료배송, 빠른배송, 배송비, 쿠폰, 할인, 특가, 최저가, 신규회원 혜택, 적립, 안전결제, 안전한 거래, 정품 보장, 교환, 환불, 고객센터, 다양한 상품, 합리적인 가격, 쇼핑 편의 같은 항목은 절대 넣지 마세요.
금지 3: confirmed와 guessed에는 오직 이 제품 자체의 기능, 구조, 소재, 사용 방법, 쓰임새만 적으세요.
자료가 쇼핑몰 공통 안내뿐이라 어떤 제품인지 전혀 특정할 수 없으면, 지어내지 말고 name에 "확인불가" 한 단어만 넣고 confirmed와 guessed는 빈 배열로 두세요.


--- 자료 ---
${src}
${searched ? '\n--- 검색으로 찾은 내용 ---\n' + searched : ''}`;

    const data = await callGemini({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: {
        temperature: 0.3,
        responseMimeType: 'application/json',
        responseSchema: RESEARCH_SCHEMA,
      },
    }, 50000);

    let p;
    try {
      p = JSON.parse(textOf(data));
    } catch (e) {
      throw new Error('분석 결과를 읽지 못했습니다: ' + textOf(data).slice(0, 120));
    }

    const BAN = /무료\s*배송|빠른\s*배송|배송비|배송\s*옵션|쿠폰|할인|특가|최저가|신규\s*회원|회원\s*혜택|적립|안전\s*결제|안전한\s*거래|정품\s*보장|교환|환불|고객\s*센터|다양한\s*상품|합리적인\s*가격|쇼핑\s*편의|구매\s*가능|특별\s*혜택/;
    const conf = (p.confirmed || []).filter((s) => s && !BAN.test(s));
    const gues = (p.guessed || []).filter((s) => s && !BAN.test(s));

    if (p.name === '확인불가' || conf.length + gues.length < 3) {
      if (!useSearch) {
        log('페이지에서 제품 정보를 찾지 못했습니다. 검색으로 다시 시도합니다… (20초쯤)');
        lock(false);
        return analyze(true);
      }
      log('이 쇼핑몰이 자동 접속을 막고 있어 페이지를 읽지 못했습니다. (알리익스프레스가 대표적입니다)');
      log('해결 방법 — 제품 페이지에서 제품 이름을 복사해 아래 "직접 수정"의 제품명 칸에 붙여넣고 ① 을 다시 누르세요. 이름만 있으면 나머지는 검색으로 자동으로 채웁니다.');
      $('manual').open = true;
      $('pname').focus();
      lock(false);
      return;

    }

    $('pname').value = p.name || page.ogTitle || page.title || '';
    $('model').value = p.model || p.name || '';
    $('feat').value = conf.concat(gues.map((v) => v + ' (추정)')).join('\n');
    $('urlinfo').textContent = $('pname').value;

    log(`분석 완료 — ${$('pname').value || '제품명 미확인'} / 확인 ${conf.length}개 · 추정 ${gues.length}개`);
    if (!conf.length) log('페이지에서 확인된 사실이 없어 추정만 채웠습니다. 내용을 한 번 확인해 주세요.');

  } catch (e) {
    log('분석 실패: ' + e.message.slice(0, 200));
    log('접힌 줄을 눌러 제품명과 특장점을 직접 넣어도 대본은 만들어집니다.');
  }
  lock(false);
}

/* ---------- ② 대본 ---------- */
const SCHEMA = {
  type: 'OBJECT',
  properties: {
    category: { type: 'STRING' },
    persona: {
      type: 'OBJECT',
      properties: {
        gender: { type: 'STRING', enum: ['female', 'male'] },
        tone: { type: 'STRING' },
        reason: { type: 'STRING' },
      },
      required: ['gender', 'tone', 'reason'],
    },
    scenes: {
      type: 'ARRAY',
      items: {
        type: 'OBJECT',
        properties: { narration: { type: 'STRING' }, caption: { type: 'STRING' } },
        required: ['narration', 'caption'],
      },
    },
    youtube: {
      type: 'OBJECT',
      properties: {
        title: { type: 'STRING' },
        description: { type: 'STRING' },
        tags: { type: 'ARRAY', items: { type: 'STRING' } },
      },
      required: ['title', 'description', 'tags'],
    },
  },
  required: ['category', 'persona', 'scenes', 'youtube'],
};

async function makeScript(pname, mname, feats, feedback) {
  const prompt = `제품: ${pname}
모델명: ${mname}
특장점 목록:
${feats}

위 제품의 유튜브 쇼츠 광고 대본을 한국어로 쓰세요. 제품에 잘 맞는 화자 페르소나를 골라 그 사람이 말하는 구어체로 씁니다.

★ 길이 규칙 (가장 중요)
- scenes는 정확히 ${SCENES}개.
- 각 scene의 narration은 공백 제외 ${PER_SCENE - 5}자 이상 ${PER_SCENE + 5}자 이하. 짧으면 실패입니다.
- 글자 수 감각: 공백 제외 24자는 "이것 하나면 번거로운 일이 한결 수월해집니다" 정도의 길이입니다. 예시 표현을 따라 쓰지 말고 길이만 참고하세요.

내용 규칙
- 특장점 목록에 없는 수치, 인증, 수상, 후기, 가격은 쓰지 마세요.
- "(추정)"이 붙은 항목은 단정하지 말고 사용자 이점 표현으로 바꾸고 수치는 언급 금지.
- "최고", "1위", "유일", "완벽" 같은 과장과 의료·건강 효능 주장은 금지.

구성
- 1번 씬은 시선을 잡는 질문이나 공감 문구.
- 2~5번 씬은 사양을 생활 속 이점으로 번역.
- 6번 씬은 구매를 유도하는 한마디.
- caption은 10자 이내 핵심어.
- youtube.title은 30자 이내이며 모델명 포함. description은 3줄 뒤 해시태그 3개. tags는 한국어 8개.${feedback ? '\n\n★ 수정 요청: ' + feedback : ''}`;

  const data = await callGemini({
    contents: [{ parts: [{ text: prompt }] }],
    generationConfig: {
      temperature: 0.9,
      responseMimeType: 'application/json',
      responseSchema: SCHEMA,
    },
  }, 50000);

  const script = JSON.parse(textOf(data));
  script.chars = noSpace(script.scenes.map((s) => s.narration).join(''));
  return script;
}

/* ---------- 음성 (Puter.js) ---------- */
const STYLE = '한국어를 밝고 친근한 쇼핑 방송 톤으로, 조금 빠르고 또렷하게 읽어주세요.';

function ttsOptions(voice) {
  const [kind, name] = voice.split(':');

  if (kind === 'openai') {
    return {
      provider: 'openai',
      model: 'gpt-4o-mini-tts',
      voice: name,
      response_format: 'mp3',
      speed: 1.15,
      instructions: STYLE,
    };
  }
  if (kind === 'xai') {
    return { provider: 'xai', voice: name, language: 'ko', output_format: 'mp3' };
  }
  return { provider: 'aws-polly', voice: name, engine: 'neural', language: 'ko-KR' };
}

async function ttsOne(text, voice) {
  if (typeof puter === 'undefined') throw new Error('Puter.js를 불러오지 못했습니다. 새로고침해 보세요.');

  let lastErr;
  for (let i = 1; i <= 3; i++) {
    try {
      const audio = await puter.ai.txt2speech(text, ttsOptions(voice));
      const src = audio && (audio.src || audio.currentSrc);
      if (!src) throw new Error('음성 주소를 받지 못했습니다');
      const buf = await (await fetch(src)).arrayBuffer();
      if (buf.byteLength < 400) throw new Error('음성이 비어 있습니다');
      return buf;
    } catch (e) {
      const raw = e && (e.message || (e.error && (e.error.message || e.error.code)));
      lastErr = new Error(raw || JSON.stringify(e).slice(0, 200));
      log(`음성 오류 (${i}/3): ${lastErr.message.slice(0, 120)}`);
      if (i < 3) await sleep(1500);
    }
  }
  throw lastErr;
}

async function makeVoice(script, voice) {
  log(`음성 ${script.scenes.length}개 동시 생성 중…`);
  const raw = await Promise.all(script.scenes.map((s) => ttsOne(s.narration, voice)));

  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const bufs = [];
  for (const r of raw) bufs.push(await ac.decodeAudioData(r.slice(0)));
  log(`디코딩 완료 (${bufs[0].sampleRate}Hz)`);

  const GAP = 0.25;
  const timeline = [];
  let t = 0;
  bufs.forEach((b, i) => {
    timeline.push({ start: +t.toFixed(2), end: +(t + b.duration).toFixed(2) });
    t += b.duration + (i < bufs.length - 1 ? GAP : 0);
  });

  ac.close();

  const clips = raw.map((r) => {
    const blob = new Blob([r], { type: 'audio/mpeg' });
    return { blob, url: URL.createObjectURL(blob) };
  });

  return { parts: bufs, clips, duration: +t.toFixed(1), timeline };
}

/* ---------- 실행 ---------- */
$('go').onclick = async () => {
  const pname = $('pname').value.trim();
  const mname = $('model').value.trim() || pname;
  const feats = $('feat').value.trim();

  const missing = [];
  if (!pname) missing.push('제품명');
  if (!feats) missing.push('특장점');

  if (missing.length) {
    if (!/^https?:\/\//i.test($('url').value.trim())) {
      resetLog('제품 페이지 링크를 먼저 넣어 주세요.');
      return;
    }
    log('분석이 안 되어 있어 먼저 링크를 분석합니다.');
    await analyze(false);
    if (!$('pname').value.trim() || !$('feat').value.trim()) {
      log('분석으로 채워지지 않았습니다. 접힌 줄을 눌러 직접 입력해 주세요.');
      return;
    }
    return $('go').onclick();
  }

  lock(true);
  resetLog('대본을 만듭니다.');
  $('out').innerHTML = '';

  try {
    let script = null, feedback = '';
    for (let n = 1; n <= 2; n++) {
      script = await makeScript(pname, mname, feats, feedback);
      log(`대본 ${n}차 — 공백 제외 ${script.chars}자 (목표 ${T_MIN}~${T_MAX}자)`);
      if (script.chars >= T_MIN && script.chars <= T_MAX) break;
      feedback = script.chars > T_MAX
        ? `전체가 ${script.chars}자로 길다. 각 narration을 ${PER_SCENE}자 안쪽으로 줄여 전체 ${TOTAL}자로 맞춰라.`
        : `전체가 ${script.chars}자로 너무 짧다. 각 narration을 공백 제외 ${PER_SCENE}자까지 늘려 전체 ${TOTAL}자로 맞춰라.`;
    }

    const pick = $('voice').value;
    const voice = pick !== 'auto' ? pick
      : (script.persona.gender === 'male' ? 'openai:ash' : 'openai:coral');
    log(`화자: ${script.persona.gender === 'male' ? '남성' : '여성'} · ${script.persona.tone} / 음성 ${voice}`);

    const v = await makeVoice(script, voice);
    log(`완성 — 음성 ${v.duration}초`);
    LAST = { script, voice: v };
    render(script, v);
  } catch (e) {
    log('실패: ' + e.message);
  }
  lock(false);
};

function render(script, voice) {
  const good = voice.duration >= 28 && voice.duration <= 42;
  const esc = (s) => String(s).replace(/</g, '&lt;');

  let h = '<div class="card">';
  h += `<span class="badge ${good ? 'ok' : 'warn'}">${voice.duration}초 · ${good ? '적정' : '범위 밖'}</span> `;
  h += `<span class="badge ok">${esc(script.category)}</span>`;
  h += `<div class="muted">화자 선택 이유: ${esc(script.persona.reason)}</div>`;
  h += `<div style="margin:10px 0"><button id="playAll">▶ 전체 음성 재생</button> <button id="stopAll">■ 정지</button></div>`;
  script.scenes.forEach((s, i) => {
    const t = voice.timeline[i];
    h += `<div class="scene"><b>${i + 1}. ${esc(s.caption)}</b> <span class="muted">${t.start}s~${t.end}s · ${noSpace(s.narration)}자</span><br>${esc(s.narration)}`;
    h += `<audio controls preload="none" src="${voice.clips[i].url}" style="height:32px"></audio></div>`;
  });
  h += '</div><div class="card"><label>유튜브 제목</label>' + esc(script.youtube.title);
  h += '<label>설명</label><div style="white-space:pre-wrap">' + esc(script.youtube.description) + '</div>';
  h += '<label>태그</label>' + esc(script.youtube.tags.join(', ')) + '</div>';
  $('out').innerHTML = h;

  const stop = () => {
    if (!window.__p) return;
    try { window.__p.nodes.forEach((n) => n.stop()); window.__p.ac.close(); } catch (e) {}
    window.__p = null;
  };

  $('playAll').onclick = () => {
    stop();
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const base = ac.currentTime + 0.15;
    const nodes = [];
    voice.parts.forEach((b, i) => {
      const s = ac.createBufferSource();
      s.buffer = b;
      s.connect(ac.destination);
      s.start(base + voice.timeline[i].start);
      nodes.push(s);
    });
    window.__p = { ac, nodes };
  };

  $('stopAll').onclick = stop;
}
