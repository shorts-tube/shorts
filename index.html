<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쇼츠 대본 생성기</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 680px; margin: 0 auto;
         padding: 24px; line-height: 1.6; color: #222; }
  h1 { font-size: 22px; }
  label { display: block; margin-top: 14px; font-weight: 600; font-size: 14px; }
  input, textarea { width: 100%; padding: 10px; font-size: 15px; box-sizing: border-box;
                    border: 1px solid #ccc; border-radius: 6px; font-family: inherit; }
  textarea { height: 130px; }
  button { margin-top: 14px; padding: 11px 18px; font-size: 15px; font-weight: 600;
           background: #1a73e8; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  button.sub { background: #fff; color: #1a73e8; border: 1px solid #1a73e8; }
  button:disabled { background: #bbb; color: #fff; border-color: #bbb; cursor: default; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  #log { margin-top: 16px; padding: 12px; background: #f5f5f5; border-radius: 6px;
         white-space: pre-wrap; font-size: 14px; min-height: 24px; }
  .box { border: 1px solid #e0e0e0; border-radius: 6px; padding: 12px; margin-top: 10px; }
  .cap { font-weight: 700; color: #1a73e8; }
  .ok { color: #137333; font-weight: 700; }
  .bad { color: #c5221f; font-weight: 700; }
  .src { font-size: 12px; color: #666; margin-top: 6px; }
  .hint { font-size: 12px; color: #666; font-weight: 400; }
  img#prev { max-width: 140px; margin-top: 10px; border-radius: 6px; }
  .hide { display: none; }
</style>
</head>
<body>

<h1>쇼츠 대본 · 음성 생성기</h1>

<label>제품 이미지</label>
<input type="file" id="img" accept="image/*">
<img id="prev" class="hide">
<div id="imginfo" class="src"></div>

<label>제품명 또는 모델명</label>
<input id="model" placeholder="예: 삼성 VC-2200W / 휴대용 커피 머신">

<div class="row">
  <button id="analyze">① 이미지로 분석 (빠름)</button>
  <button id="search" class="sub">① 검색으로 분석 (느림)</button>
</div>
<div class="src">브랜드와 모델번호를 정확히 아는 제품만 검색이 유용합니다.</div>

<div id="step2" class="hide">
  <label>제품명 <span class="hint">수정 가능</span></label>
  <input id="name">

  <label>특장점 <span class="hint">틀린 내용은 지우고 직접 보완하세요</span></label>
  <textarea id="specs"></textarea>
  <div id="sources" class="src"></div>

  <button id="go">② 대본 · 음성 만들기</button>
</div>

<div id="log"></div>
<div id="out"></div>

<script>
const WORKER = 'https://gemini-proxy.webnjw01.workers.dev';
const $ = (id) => document.getElementById(id);
const log = (m) => { $('log').textContent = m; };
const wait = (ms) => new Promise(r => setTimeout(r, ms));

let imageData = null, imageMime = 'image/jpeg';

/* ───────── 이미지 축소 (속도 핵심) ───────── */

$('img').onchange = (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  const im = new Image();
  im.onload = () => {
    const MAX = 768;
    const scale = Math.min(1, MAX / Math.max(im.width, im.height));
    const w = Math.round(im.width * scale), h = Math.round(im.height * scale);
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(im, 0, 0, w, h);
    const dataUrl = cv.toDataURL('image/jpeg', 0.85);
    imageData = dataUrl.split(',')[1];
    imageMime = 'image/jpeg';
    $('prev').src = dataUrl;
    $('prev').classList.remove('hide');
    $('imginfo').textContent =
      `${im.width}×${im.height} → ${w}×${h} / 약 ${Math.round(imageData.length / 1365)}KB로 압축`;
    URL.revokeObjectURL(url);
  };
  im.onerror = () => log('이미지를 읽을 수 없습니다. 다른 파일을 선택하세요.');
  im.src = url;
};

/* ───────── Gemini 호출 ───────── */

async function callGemini(model, payload, ms = 60000, onRetry = null) {
  const MAX = 3;
  for (let a = 1; a <= MAX; a++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    try {
      const res = await fetch(WORKER, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model, payload }),
        signal: ctrl.signal,
      });
      clearTimeout(timer);
      const data = await res.json();

      if (data.error) {
        const msg = data.error.message || JSON.stringify(data.error);
        const retryable = [429, 500, 503].includes(data.error.code) ||
          /high demand|overload|unavailable|rate limit/i.test(msg);
        if (retryable && a < MAX) {
          if (onRetry) onRetry(`서버가 붐빕니다. ${a * 5}초 후 재시도`);
          await wait(a * 5000);
          continue;
        }
        throw new Error(msg);
      }
      return data;

    } catch (e) {
      clearTimeout(timer);
      if (e.name === 'AbortError') {
        if (a < MAX) {
          if (onRetry) onRetry(`응답이 늦습니다. 재시도 (${a}/${MAX - 1})`);
          continue;
        }
        throw new Error('응답 시간 초과. 이미지가 크거나 서버가 붐빕니다.');
      }
      throw e;
    }
  }
}

/* ───────── ① 제품 분석 ───────── */

function researchPrompt(modelCode, useSearch) {
  return `첨부된 제품 이미지를 분석하세요. 사용자가 입력한 이름: "${modelCode}"
${useSearch ? '검색으로 실제 제품 정보를 확인하세요.' : '이미지에 보이는 것만 근거로 판단하세요.'}

아래 형식으로만 답하세요. 인사말·설명 금지.

제품명: (한 줄)
특장점:
- (항목 5~7개. 한 줄에 하나)

작성 지침:
- 이미지에서 명확히 보이는 형태, 재질, 구조, 용도, 사용 환경을 근거로 쓸 것.
- "원통형 본체", "버튼 존재"처럼 외형을 그대로 옮기지 말고,
  "한 손에 쥐는 크기", "버튼 하나로 작동" 처럼 사용자 이점으로 표현할 것.
- ${useSearch ? '검색으로 확인된 수치만 쓸 것. 확인 안 되면 수치를 쓰지 말 것.'
              : '구체적 수치, 인증, 수상 내역은 절대 쓰지 말 것.'}
- "(추정)" 같은 표시는 붙이지 말 것.`;
}

async function doAnalyze(useSearch) {
  const modelCode = $('model').value.trim();
  if (!imageData) return log('제품 이미지를 먼저 선택하세요.');
  if (!modelCode) return log('제품명 또는 모델명을 입력하세요.');

  $('analyze').disabled = true;
  $('search').disabled = true;
  log(useSearch ? '검색하며 분석하고 있습니다...' : '이미지를 분석하고 있습니다...');

  try {
    const payload = {
      contents: [{
        parts: [
          { inlineData: { mimeType: imageMime, data: imageData } },
          { text: researchPrompt(modelCode, useSearch) },
        ],
      }],
    };
    if (useSearch) payload.tools = [{ google_search: {} }];

    const res = await callGemini('gemini-2.5-flash', payload,
                                 useSearch ? 60000 : 40000, (m) => log(m));
    const cand = res.candidates[0];
    const text = cand.content.parts.map(p => p.text || '').join('');

    const name = (text.match(/제품명\s*:\s*(.+)/) || [, modelCode])[1].trim();
    const specs = text.split('\n')
      .filter(l => l.trim().startsWith('-'))
      .map(l => l.replace(/^\s*-\s*/, '').replace(/\s*\(추정\)\s*/g, '').trim())
      .filter(Boolean);

    if (!specs.length) throw new Error('특장점을 추출하지 못했습니다. 다시 시도하세요.');

    $('name').value = name;
    $('specs').value = specs.join('\n');

    const links = (cand.groundingMetadata?.groundingChunks || [])
      .map(c => c.web?.title).filter(Boolean);
    $('sources').textContent = useSearch
      ? (links.length ? '참고 출처: ' + [...new Set(links)].slice(0, 5).join(' / ')
                      : '검색 출처가 없습니다. 내용을 직접 확인하세요.')
      : '이미지 분석 결과입니다. 실제 스펙을 직접 보완하면 대본 품질이 올라갑니다.';

    $('step2').classList.remove('hide');
    log('분석 완료. 내용을 확인·수정한 뒤 ② 버튼을 누르세요.');
  } catch (e) {
    log('분석 오류: ' + e.message);
  } finally {
    $('analyze').disabled = false;
    $('search').disabled = false;
  }
}

$('analyze').onclick = () => doAnalyze(false);
$('search').onclick = () => doAnalyze(true);

/* ───────── 대본 ───────── */

const SCHEMA = {
  type: 'object',
  properties: {
    category: { type: 'string' },
    persona: {
      type: 'object',
      properties: {
        gender: { type: 'string', enum: ['female', 'male'] },
        tone: { type: 'string' },
        reason: { type: 'string' },
      },
      required: ['gender', 'tone', 'reason'],
    },
    scenes: {
      type: 'array',
      items: {
        type: 'object',
        properties: {
          narration: { type: 'string' },
          caption: { type: 'string' },
        },
        required: ['narration', 'caption'],
      },
    },
    youtube: {
      type: 'object',
      properties: {
        title: { type: 'string' },
        description: { type: 'string' },
        tags: { type: 'array', items: { type: 'string' } },
      },
      required: ['title', 'description', 'tags'],
    },
  },
  required: ['category', 'persona', 'scenes', 'youtube'],
};

function buildPrompt(name, modelCode, specs, feedback) {
  return `당신은 한국 이커머스 쇼츠 광고 카피라이터입니다.
아래 정보로 쇼츠 대본을 작성하세요.

제품명: ${name}
모델명: ${modelCode}
특장점:
${specs.map(s => '- ' + s).join('\n')}

[절대 규칙]
- 모든 narration 합계는 공백 제외 185~215자. 반드시 지킬 것.
- 위 목록에 없는 수치, 인증, 수상, 후기는 절대 만들지 말 것.
- "최고", "1위", "유일", "완벽" 등 과장 표현 금지. 의료 효능 주장 금지.

[구성]
- scenes는 정확히 6개. 첫 씬은 3초 이내의 훅.
- 중간 씬은 특장점을 사용자 이점으로 번역.
- 마지막 씬은 구매 유도 한 문장.
- narration은 구어체, 한 문장 25자 이내.
- caption은 화면 자막. 10자 이내.

[유튜브]
- title 30자 이내. description 3줄 + 해시태그 3개. tags 한국어 8개.
${feedback ? '\n[수정 요청]\n' + feedback : ''}`;
}

/* ───────── 음성 ───────── */

function pcmToWav(bytes, rate = 24000) {
  const buf = new ArrayBuffer(44 + bytes.length);
  const v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + bytes.length, true); str(8, 'WAVEfmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, bytes.length, true);
  new Uint8Array(buf, 44).set(bytes);
  return new Blob([buf], { type: 'audio/wav' });
}

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function ttsOne(text, voice, onRetry) {
  const data = await callGemini('gemini-2.5-flash-preview-tts', {
    contents: [{ parts: [{ text: `밝고 친근한 쇼핑 방송 톤으로 조금 빠르게 읽어줘: ${text}` }] }],
    generationConfig: {
      responseModalities: ['AUDIO'],
      speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } } },
    },
  }, 45000, onRetry);
  const part = data.candidates?.[0]?.content?.parts?.[0];
  if (!part?.inlineData?.data) throw new Error('음성 데이터가 비어 있습니다');
  return b64ToBytes(part.inlineData.data);
}

async function makeVoice(script, onProgress) {
  const voice = script.persona.gender === 'male' ? 'Puck' : 'Kore';
  const chunks = [], timeline = [];
  let cursor = 0;

  for (let i = 0; i < script.scenes.length; i++) {
    const tag = `음성 ${i + 1}/${script.scenes.length}`;
    onProgress(tag);
    const bytes = await ttsOne(script.scenes[i].narration, voice,
                               (m) => onProgress(`${tag} · ${m}`));
    const sec = bytes.length / 48000;
    timeline.push({ index: i, start: cursor, end: cursor + sec });
    cursor += sec + 0.25;
    chunks.push(bytes, new Uint8Array(12000));
    await wait(800);
  }

  const total = chunks.reduce((n, c) => n + c.length, 0);
  const merged = new Uint8Array(total);
  let o = 0;
  for (const c of chunks) { merged.set(c, o); o += c.length; }
  return { blob: pcmToWav(merged), seconds: merged.length / 48000, timeline };
}

/* ───────── 실행 ───────── */

$('go').onclick = async () => {
  const name = $('name').value.trim();
  const modelCode = $('model').value.trim();
  const specs = $('specs').value.split('\n').map(s => s.trim()).filter(Boolean);

  if (!name) return log('제품명을 입력하세요.');
  if (!specs.length) return log('특장점을 한 줄 이상 입력하세요.');

  $('go').disabled = true;
  $('out').innerHTML = '';
  let feedback = null;

  try {
    for (let i = 1; i <= 2; i++) {
      log(`[${i}/2] 대본을 만들고 있습니다...`);
      const res = await callGemini('gemini-2.5-flash', {
        contents: [{ parts: [{ text: buildPrompt(name, modelCode, specs, feedback) }] }],
        generationConfig: {
          responseMimeType: 'application/json',
          responseSchema: SCHEMA,
          temperature: 0.9,
        },
      }, 40000, (m) => log(`[${i}/2] ${m}`));

      const script = JSON.parse(res.candidates[0].content.parts[0].text);
      const narration = script.scenes.map(s => s.narration.trim()).join(' ');
      const chars = narration.replace(/\s/g, '').length;

      const voice = await makeVoice(script, (m) => log(`[${i}/2] ${m} · ${chars}자`));
      const sec = voice.seconds;
      window.lastResult = { script, voice, imageData, imageMime };

      if (sec >= 28 && sec <= 42) {
        render(script, chars, sec, voice.blob, true);
        log('완성되었습니다.');
        return;
      }
      render(script, chars, sec, voice.blob, false);
      const diff = Math.round((sec - 35) * 5.7);
      feedback = sec > 42
        ? `전체 ${sec.toFixed(1)}초로 깁니다. narration 총합을 ${diff}자 줄이세요.`
        : `전체 ${sec.toFixed(1)}초로 짧습니다. narration 총합을 ${-diff}자 늘리세요.`;
    }
    log('길이가 맞지 않습니다. 위 결과를 쓰거나 다시 시도하세요.');
  } catch (e) {
    log('오류: ' + e.message);
  } finally {
    $('go').disabled = false;
  }
};

function render(script, chars, sec, blob, pass) {
  const url = URL.createObjectURL(blob);
  const badge = pass
    ? `<span class="ok">${sec.toFixed(1)}초 · 적정</span>`
    : `<span class="bad">${sec.toFixed(1)}초 · 범위 밖</span>`;
  $('out').innerHTML = `
    <div class="box">
      <div>${badge} / ${chars}자 / ${script.category}</div>
      <div>모델: ${script.persona.gender === 'male' ? '남성' : '여성'} ·
           ${script.persona.tone} — ${script.persona.reason}</div>
      <audio controls src="${url}" style="width:100%;margin-top:10px"></audio>
    </div>
    ${script.scenes.map((s, i) => `
      <div class="box"><div class="cap">${i + 1}. ${s.caption}</div><div>${s.narration}</div></div>
    `).join('')}
    <div class="box">
      <div class="cap">유튜브 제목</div><div>${script.youtube.title}</div>
      <div class="cap" style="margin-top:8px">설명</div>
      <div style="white-space:pre-wrap">${script.youtube.description}</div>
      <div class="cap" style="margin-top:8px">태그</div><div>${script.youtube.tags.join(', ')}</div>
    </div>`;
}
</script>
</body>
</html>
