<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쇼츠 대본 · 음성 생성기</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
         max-width: 760px; margin: 0 auto; padding: 20px; background: #f6f7f9; color: #1a1a1a; }
  h1 { font-size: 20px; }
  .card { background: #fff; border: 1px solid #e3e5e8; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-weight: 600; font-size: 13px; margin: 12px 0 5px; }
  input[type=text], textarea { width: 100%; padding: 9px; border: 1px solid #ccd; border-radius: 6px; font-size: 14px; font-family: inherit; }
  button { padding: 10px 14px; border: 1px solid #ccd; background: #fff; border-radius: 6px; font-size: 14px; cursor: pointer; }
  button:hover { background: #f0f2f5; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; width: 100%; font-weight: 600; margin-top: 16px; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row button { flex: 1; }
  .muted { font-size: 12px; color: #666; margin-top: 6px; line-height: 1.6; }
  #preview { max-width: 180px; border-radius: 6px; margin-top: 8px; display: block; }
  pre#log { background: #1e1e1e; color: #b8e986; padding: 12px; border-radius: 8px;
            font-size: 12px; max-height: 200px; overflow: auto; white-space: pre-wrap; line-height: 1.6; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .ok { background: #e3f3e5; color: #1a7f37; }
  .warn { background: #fff4e0; color: #9a6400; }
  .scene { border-top: 1px solid #eee; padding: 9px 0; font-size: 14px; }
  .scene b { color: #1a73e8; }
  audio { width: 100%; margin-top: 10px; }
</style>
</head>
<body>

<h1>쇼츠 대본 · 음성 생성기</h1>

<div class="card">
  <label>제품 이미지</label>
  <input type="file" id="img" accept="image/*">
  <div class="muted" id="imginfo"></div>
  <img id="preview" alt="">

  <label>모델명</label>
  <input type="text" id="model" placeholder="예: 샤오미 VC200 (브랜드를 함께 쓰면 검색이 잘 됩니다)">

  <div class="row">
    <button id="byImage">① 이미지로 분석 (빠름)</button>
    <button id="bySearch">① 검색해서 분석 (느림)</button>
  </div>
  <div class="muted">모호한 이름이면 왼쪽을, 브랜드가 분명하면 오른쪽을 쓰세요.</div>

  <label>제품명</label>
  <input type="text" id="pname" placeholder="분석 후 자동 입력 · 직접 수정 가능">

  <label>특장점 (한 줄에 하나)</label>
  <textarea id="feat" rows="7" placeholder="분석 후 자동 입력 · 직접 수정 가능"></textarea>
  <div class="muted" id="sources"></div>

  <button class="primary" id="go">② 대본 · 음성 만들기</button>
</div>

<pre id="log">준비됨.</pre>
<div id="out"></div>

<script>
const WORKER = 'https://gemini-proxy.webnjw01.workers.dev';
const TEXT_MODELS = ['gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-2.0-flash'];
const TTS_MODEL = 'gemini-2.5-flash-preview-tts';
const RATE = 24000;

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let IMG = null;
let LAST = null;

function log(msg) {
  const t = new Date().toLocaleTimeString('ko-KR', { hour12: false });
  $('log').textContent += `\n[${t}] ${msg}`;
  $('log').scrollTop = $('log').scrollHeight;
}
function resetLog(msg) { $('log').textContent = msg; }
function lock(on) { ['byImage', 'bySearch', 'go'].forEach((id) => { $(id).disabled = on; }); }

/* ---------- 이미지 축소 ---------- */
$('img').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const r = await compress(file);
    IMG = r.b64;
    $('preview').src = 'data:image/jpeg;base64,' + r.b64;
    $('imginfo').textContent = `${r.ow}×${r.oh} → ${r.w}×${r.h} / 약 ${Math.round(r.bytes / 1024)}KB로 압축`;
  } catch (err) {
    $('imginfo').textContent = '이미지를 읽을 수 없습니다: ' + err.message;
  }
};

function compress(file, MAX = 768, Q = 0.85) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const ow = im.naturalWidth, oh = im.naturalHeight;
      const s = Math.min(1, MAX / Math.max(ow, oh));
      const w = Math.round(ow * s), h = Math.round(oh * s);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(im, 0, 0, w, h);
      const b64 = c.toDataURL('image/jpeg', Q).split(',')[1];
      URL.revokeObjectURL(url);
      resolve({ b64, w, h, ow, oh, bytes: Math.round(b64.length * 0.75) });
    };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('형식 오류')); };
    im.src = url;
  });
}

/* ---------- 모델 체인 호출 ---------- */
async function callGemini(models, payload, timeout = 45000, rounds = 2) {
  const list = Array.isArray(models) ? models : [models];
  let lastErr = new Error('알 수 없는 오류');

  for (let round = 1; round <= rounds; round++) {
    for (const model of list) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeout);
      try {
        log(`${model} 요청 중…`);
        const res = await fetch(WORKER, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model, payload }),
          signal: ctrl.signal,
        });
        const data = await res.json();
        clearTimeout(timer);

        if (data && data.error) throw new Error(`${res.status} ${data.error.message || ''}`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        if (!data.candidates || !data.candidates.length) throw new Error('응답이 비어 있습니다');
        return data;
      } catch (e) {
        clearTimeout(timer);
        const msg = e.name === 'AbortError' ? `시간 초과 ${timeout / 1000}초` : (e.message || String(e));
        lastErr = new Error(msg);
        const busy = /high demand|overload|unavailable|시간 초과|50[0-3]|429|quota|rate limit/i.test(msg);
        if (!busy) { log('오류: ' + msg); throw lastErr; }
        log(`${model} 혼잡 → 전환 (${msg.slice(0, 70)})`);
        await sleep(2000);
      }
    }
  }
  throw lastErr;
}

function textOf(data) {
  const parts = (data.candidates[0].content && data.candidates[0].content.parts) || [];
  return parts.map((p) => p.text || '').join('').trim();
}

/* ---------- ① 분석 ---------- */
const FORMAT = `출력은 다른 말 없이 아래 형식만 사용하세요.
제품명: <제품명>
확인됨:
- <근거가 확실한 사실>
추정:
- <미루어 보이는 특징>

규칙: 확인된 근거가 없는 숫자 성능값, 인증, 수상, 후기, 가격은 절대 쓰지 마세요.
항목은 각 최대 5개, 한 줄 30자 이내.`;

$('byImage').onclick = () => analyze(false);
$('bySearch').onclick = () => analyze(true);

async function analyze(useSearch) {
  if (!IMG) return alert('제품 이미지를 먼저 선택하세요.');
  const name = $('model').value.trim();
  if (!name) return alert('모델명을 입력하세요.');

  lock(true);
  resetLog(useSearch ? '검색해서 분석합니다.' : '이미지로 분석합니다.');
  $('sources').textContent = '';

  const prompt = useSearch
    ? `"${name}" 제품을 검색해서 사양과 특장점을 정리하세요. 첨부 이미지와 같은 제품인지 확인하세요.\n검색으로 확인된 내용은 "확인됨", 이미지나 일반적 추측에 기댄 내용은 "추정"에 넣으세요.\n${FORMAT}`
    : `첨부 이미지는 "${name}" 제품입니다. 이미지에서 보이는 형태, 구조, 표기된 문구, 용도만 근거로 정리하세요.\n${FORMAT}`;

  const payload = {
    contents: [{ parts: [{ inlineData: { mimeType: 'image/jpeg', data: IMG } }, { text: prompt }] }],
    generationConfig: { temperature: 0.4 },
  };
  if (useSearch) payload.tools = [{ google_search: {} }];

  try {
    const data = await callGemini(TEXT_MODELS, payload, useSearch ? 70000 : 45000);
    const parsed = parseResearch(textOf(data));
    if (parsed.name) $('pname').value = parsed.name;
    $('feat').value = parsed.confirmed.concat(parsed.guessed.map((v) => v + ' (추정)')).join('\n');

    const meta = data.candidates[0].groundingMetadata;
    const chunks = (meta && meta.groundingChunks) || [];
    if (chunks.length) {
      const names = chunks.slice(0, 6).map((c) => (c.web && (c.web.title || c.web.uri)) || '').filter(Boolean);
      $('sources').textContent = '출처: ' + names.join(' · ');
    }
    log(`분석 완료 — 확인 ${parsed.confirmed.length}개 / 추정 ${parsed.guessed.length}개`);
    log('내용을 확인·수정한 뒤 ② 버튼을 누르세요.');
  } catch (e) {
    log('분석 실패: ' + e.message);
    log('잠시 뒤 다시 시도하거나, 특장점을 직접 입력해도 대본은 만들어집니다.');
  }
  lock(false);
}

function parseResearch(text) {
  const out = { name: '', confirmed: [], guessed: [] };
  let mode = '';
  text.split('\n').forEach((raw) => {
    const line = raw.trim();
    if (!line) return;
    if (/^제품명\s*[:：]/.test(line)) { out.name = line.replace(/^제품명\s*[:：]\s*/, ''); return; }
    if (/^확인됨/.test(line)) { mode = 'c'; return; }
    if (/^추정/.test(line)) { mode = 'g'; return; }
    const item = line.replace(/^[-*•\d.)\s]+/, '').trim();
    if (!item) return;
    if (mode === 'c') out.confirmed.push(item);
    else if (mode === 'g') out.guessed.push(item);
  });
  return out;
}

/* ---------- ② 대본 + 음성 ---------- */
const SCHEMA = {
  type: 'OBJECT',
  properties: {
    category: { type: 'STRING' },
    persona: {
      type: 'OBJECT',
      properties: {
        gender: { type: 'STRING', enum: ['female', 'male'] },
        tone: { type: 'STRING' },
        reason: { type: 'STRING' },
      },
      required: ['gender', 'tone', 'reason'],
    },
    scenes: {
      type: 'ARRAY',
      items: {
        type: 'OBJECT',
        properties: { narration: { type: 'STRING' }, caption: { type: 'STRING' } },
        required: ['narration', 'caption'],
      },
    },
    youtube: {
      type: 'OBJECT',
      properties: {
        title: { type: 'STRING' },
        description: { type: 'STRING' },
        tags: { type: 'ARRAY', items: { type: 'STRING' } },
      },
      required: ['title', 'description', 'tags'],
    },
  },
  required: ['category', 'persona', 'scenes', 'youtube'],
};

function noSpace(s) { return s.replace(/\s/g, '').length; }

async function makeScript(pname, mname, feats, feedback) {
  const prompt = `제품: ${pname}
모델명: ${mname}
특장점 목록:
${feats}

위 제품의 유튜브 쇼츠 광고 대본을 한국어로 쓰세요. 제품에 잘 맞는 화자 페르소나를 골라 그 사람이 말하는 구어체로 씁니다.

절대 규칙
- narration 전체 합계는 공백 제외 185자 이상 215자 이하.
- 특장점 목록에 없는 수치, 인증, 수상, 후기, 가격은 쓰지 마세요.
- "(추정)"이 붙은 항목은 단정하지 말고 사용자 이점 표현으로 바꾸세요. 수치는 언급 금지.
- "최고", "1위", "유일", "완벽" 같은 과장과 의료·건강 효능 주장은 금지.

구성
- scenes는 6개.
- 1번 씬은 3초 안에 끝나는 훅.
- 중간 씬은 사양을 생활 속 이점으로 번역.
- 마지막 씬은 구매를 유도하는 한마디.
- narration은 한 문장, 25자 이내. caption은 10자 이내 핵심어.
- youtube.title은 30자 이내이며 모델명 포함. description은 3줄 뒤 해시태그 3개. tags는 한국어 8개.${feedback ? '\n\n수정 요청: ' + feedback : ''}`;

  const data = await callGemini(TEXT_MODELS, {
    contents: [{ parts: [{ text: prompt }] }],
    generationConfig: {
      temperature: 0.9,
      responseMimeType: 'application/json',
      responseSchema: SCHEMA,
    },
  }, 50000);

  const script = JSON.parse(textOf(data));
  script.chars = noSpace(script.scenes.map((s) => s.narration).join(' '));
  return script;
}

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function ttsOne(text, gender) {
  const voice = gender === 'male' ? 'Puck' : 'Kore';
  const data = await callGemini([TTS_MODEL], {
    contents: [{ parts: [{ text: `밝고 친근한 쇼핑 방송 톤으로, 조금 빠르게 읽어줘: ${text}` }] }],
    generationConfig: {
      responseModalities: ['AUDIO'],
      speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } } },
    },
  }, 60000, 3);

  const parts = data.candidates[0].content.parts || [];
  const hit = parts.find((p) => p.inlineData && p.inlineData.data);
  if (!hit) throw new Error('음성 데이터가 없습니다');
  return b64ToBytes(hit.inlineData.data);
}

async function makeVoice(script) {
  const chunks = [];
  const timeline = [];
  const GAP = new Uint8Array(RATE * 2 * 0.25);
  let cursor = 0;

  for (let i = 0; i < script.scenes.length; i++) {
    log(`음성 ${i + 1}/${script.scenes.length}`);
    const pcm = await ttsOne(script.scenes[i].narration, script.persona.gender);
    const dur = pcm.length / (RATE * 2);
    timeline.push({ index: i, start: +cursor.toFixed(2), end: +(cursor + dur).toFixed(2) });
    chunks.push(pcm);
    cursor += dur;
    if (i < script.scenes.length - 1) { chunks.push(GAP); cursor += 0.25; }
    await sleep(800);
  }

  const total = chunks.reduce((n, c) => n + c.length, 0);
  const merged = new Uint8Array(total);
  let off = 0;
  chunks.forEach((c) => { merged.set(c, off); off += c.length; });
  return { wav: pcmToWav(merged), duration: +cursor.toFixed(1), timeline };
}

function pcmToWav(pcm) {
  const buf = new ArrayBuffer(44 + pcm.length);
  const v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF');
  v.setUint32(4, 36 + pcm.length, true);
  str(8, 'WAVEfmt ');
  v.setUint32(16, 16, true);
  v.setUint16(20, 1, true);
  v.setUint16(22, 1, true);
  v.setUint32(24, RATE, true);
  v.setUint32(28, RATE * 2, true);
  v.setUint16(32, 2, true);
  v.setUint16(34, 16, true);
  str(36, 'data');
  v.setUint32(40, pcm.length, true);
  new Uint8Array(buf, 44).set(pcm);
  return new Blob([buf], { type: 'audio/wav' });
}

$('go').onclick = async () => {
  const pname = $('pname').value.trim();
  const mname = $('model').value.trim();
  const feats = $('feat').value.trim();
  if (!pname || !mname || !feats) return alert('제품명, 모델명, 특장점을 모두 채우세요.');

  lock(true);
  resetLog('대본을 만듭니다.');
  $('out').innerHTML = '';

  try {
    let script = null, feedback = '';
    for (let tryNo = 1; tryNo <= 3; tryNo++) {
      script = await makeScript(pname, mname, feats, feedback);
      log(`대본 ${tryNo}차 — 공백 제외 ${script.chars}자`);
      if (script.chars >= 185 && script.chars <= 215) break;
      feedback = script.chars > 215
        ? `전체가 ${script.chars}자로 길다. ${script.chars - 200}자 정도 줄여라.`
        : `전체가 ${script.chars}자로 짧다. ${200 - script.chars}자 정도 늘려라.`;
      if (tryNo < 3) log('길이 조정 후 다시 생성');
    }

    log(`화자: ${script.persona.gender === 'male' ? '남성' : '여성'} · ${script.persona.tone}`);
    const voice = await makeVoice(script);
    log(`완성 — 음성 ${voice.duration}초`);

    LAST = { script, voice };
    render(script, voice);
  } catch (e) {
    log('실패: ' + e.message);
    log('구글 서버 혼잡이면 1~2분 뒤 같은 버튼을 다시 누르세요.');
  }
  lock(false);
};

function render(script, voice) {
  const good = voice.duration >= 28 && voice.duration <= 42;
  const url = URL.createObjectURL(voice.wav);
  const esc = (s) => String(s).replace(/</g, '&lt;');

  let html = '<div class="card">';
  html += `<span class="badge ${good ? 'ok' : 'warn'}">${voice.duration}초 · ${good ? '적정' : '범위 밖'}</span> `;
  html += `<span class="badge ok">${esc(script.category)}</span>`;
  html += `<div class="muted">화자 선택 이유: ${esc(script.persona.reason)}</div>`;
  html += `<audio controls src="${url}"></audio>`;
  html += `<div style="margin-top:8px"><a href="${url}" download="narration.wav">음성 파일 내려받기</a></div>`;
  script.scenes.forEach((s, i) => {
    const t = voice.timeline[i];
    html += `<div class="scene"><b>${i + 1}. ${esc(s.caption)}</b> <span class="muted">${t.start}s~${t.end}s</span><br>${esc(s.narration)}</div>`;
  });
  html += '</div><div class="card"><label>유튜브 제목</label>' + esc(script.youtube.title);
  html += '<label>설명</label><div style="white-space:pre-wrap">' + esc(script.youtube.description) + '</div>';
  html += '<label>태그</label>' + esc(script.youtube.tags.join(', ')) + '</div>';
  $('out').innerHTML = html;
}
</script>
</body>
</html>
